[build]
  command = "bun run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Same rules as public/_headers, kept here so they hold even if that file
# stops being copied into the output directory.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
